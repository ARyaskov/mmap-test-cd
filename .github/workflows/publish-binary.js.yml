name: Publish Binaries

on:
  push:
    tags: v*

jobs:
  build:
    runs-on: ${{ matrix.build-type.os }}

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        build-type: [
          {os: "ubuntu-latest", arch: "x64"},
          {os: "macos-latest", arch: "x64"},
          {os: "macos-latest", arch: "arm64"},
          {os: "windows-latest", arch: "x64"}
        ]
        node-version: [16.x, 18.x, 20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Add msbuild to PATH (Windows)
        if: matrix.build-type.os == 'windows-latest'
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'

      - name: Install dependencies
        run: npm ci

      # Configure node-gyp with exceptions enabled
      - name: Configure node-gyp
        shell: bash
        run: |
          echo '{"cflags_cc": ["-fexceptions"]}' > binding.gyp.json
          cat binding.gyp.json

      - name: Build TypeScript
        run: npm run build-es

      # Build with exceptions enabled
      - name: Build binary
        shell: bash
        run: |
          export CXXFLAGS="-fexceptions"
          npm run build-addon

      - name: Package binary
        env:
          NODE_PRE_GYP_GITHUB_TOKEN: ${{ secrets.NODE_PRE_GYP_GITHUB_TOKEN }}
        run: |
          npm run package-binary

      - name: Push binary
        env:
          NODE_PRE_GYP_GITHUB_TOKEN: ${{ secrets.NODE_PRE_GYP_GITHUB_TOKEN }}
        run: |
          npm run push-binary