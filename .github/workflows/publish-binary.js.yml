name: Publish Binaries

on:
  push:
    tags: v*

jobs:
  build:
    runs-on: ${{ matrix.build-type.os }}

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        build-type: [
          {os: "windows-2019", arch: "amd64"},
          {os: "ubuntu-20.04", arch: "amd64"},
          {os: "ubuntu-20.04", arch: "arm64"},
          {os: "macos-12", arch: "amd64"}, # Monterey
          {os: "macos-12", arch: "arm64"}, # Monterey
        ]
        node-version: [18.x, 20.x, 21.x, 22.x, 23.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable Corepack
        run: corepack enable

      - name: Set Yarn Version
        run: yarn set version 1.22.22

      - name: Install Global Dependencies
        run: |
          yarn global add node-gyp

      - name: Install Dependencies
        run: |
          yarn

      - name: Add msbuild to PATH (Windows)
        if: matrix.build-type.os == 'windows-2019'
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      # Configure node-gyp with exceptions enabled
      - name: Configure node-gyp
        shell: bash
        run: |
          echo '{"cflags_cc": ["-fexceptions"]}' > binding.gyp.json

      - name: Clean build
        run: yarn clean

      - name: Build TypeScript
        run: yarn tsc

      - name: Copy type definitions
        shell: bash
        run: |
          mkdir -p dist
          cp mmap-io.d.ts dist/
          cp dist/mmap-io.d.ts ./

      # Build with exceptions enabled
      - name: Build binary
        shell: bash
        run: |
          export CXXFLAGS="-fexceptions"
          yarn build-addon

      - name: Package binary
        env:
          NODE_PRE_GYP_GITHUB_TOKEN: ${{ secrets.NODE_PRE_GYP_GITHUB_TOKEN }}
        run: yarn package-binary

      - name: Push binary
        env:
          NODE_PRE_GYP_GITHUB_TOKEN: ${{ secrets.NODE_PRE_GYP_GITHUB_TOKEN }}
        run: yarn push-binary